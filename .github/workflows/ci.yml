name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_OFFLINE: '1'
      TG_REDESIGN_OUTPUT: ../../verification/ci
      TG_POLISH_OUTPUT: ../../verification/ci
      TG_PORTIONS_OUTPUT: ../../verification/ci
      TG_TEST_REPORT: ../../verification/ci/browser-results.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            verification/ci
            verification/targets-support
            apps/mobile/test-results
          retention-days: 7
