name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: "Do not attach personal backups, diary data, recordings or credentials."
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use an example meal or public food ID where possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, OS, browser or Expo runtime
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      description: Include whether this is a development build, TestFlight build or web preview.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or relevant error text
      description: Remove personal records and credentials first. Never upload a backup file.
